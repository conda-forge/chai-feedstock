{% set version = "1.1.2" %}

package:
  name: chai
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/c/chai/chai-{{ version }}.tar.gz
  sha256: ff8d2b6855f660cd23cd5ec79bd10264d39f24f6235773331b48e7fcd637d6cc

build:
  noarch: python
  number: 2
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}

test:
  requires:
    - python {{ python_min }}
  imports:
    - chai

about:
  home: https://github.com/agoragames/chai
  license: BSD 3-Clause
  license_file: LICENSE.txt
  summary: 'Easy to use mocking, stubbing and spying framework.'
  license_family: BSD

extra:
  recipe-maintainers:
    - bollwyvl
    - ocefpaf
